<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eeede5">
<title>Aquifer — The Watershed Council</title>
<link rel="stylesheet" href="/pact/style.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="brand-mark" id="brandIcon" aria-hidden="true"></span><div><h1>Aquifer</h1><p>The Watershed Council</p></div></div>
    <nav class="top-nav" aria-label="Game controls"><button class="btn" data-action="rules">Rules</button><button class="btn primary hide" id="roomButton" data-action="room">Room</button></nav>
  </header>
  <main id="lobby" class="lobby" aria-label="Online lobby"></main>
  <main id="game" class="hide" aria-label="Aquifer game table">
    <section class="basin" id="basin" aria-label="Shared aquifer"></section>
    <div class="table">
      <aside class="players" aria-label="Stakeholders">
        <h2 class="overline">Stakeholders</h2><div class="player-list" id="players"></div>
        <button class="btn guide" data-action="tutorial" id="guide">First game? Learn to play</button>
      </aside>
      <section class="board" id="board" aria-label="Event and infrastructure">
        <canvas class="topo" id="topo" aria-hidden="true"></canvas>
        <div class="board-head"><h2 class="overline">Current event</h2><div class="deck" id="deck"></div></div>
        <div class="event-area" id="event"></div>
        <section class="lane" aria-labelledby="infra-title"><h2 class="overline" id="infra-title">Infrastructure</h2><div class="projects" id="projects"></div></section>
      </section>
    </div>
    <section class="tray" id="tray" aria-label="Hand and turn controls"></section>
  </main>
  <footer class="footer"><div><div id="status" aria-live="polite"></div><div id="notice" class="net-notice" role="status"></div></div><button data-action="print">Print prototype cards</button></footer>
</div>
<div id="table-effects" class="table-effects" aria-hidden="true"></div>
<dialog id="dialog" aria-labelledby="dialogTitle"></dialog>
<section class="print-sheet" id="printSheet" aria-label="Printable cards"></section>
<script type="module" src="/pact/ui.js"></script>
</body>
</html>
